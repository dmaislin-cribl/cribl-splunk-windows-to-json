FIELDALIAS-body_for_windows_system = signature_message AS body, Message AS body

REPORT-1service_name_eventcode_7036 = service_name_eventcode_7036
REPORT-1service_name_eventcode_7040 = service_name_eventcode_7040
EVAL-status = case(EventCode=="7036" AND status=="running","started",EventCode=="7036" AND status=="stopped","stopped",EventCode=="104","success")

LOOKUP-0start_mode_for_eventcode_7040_service_windows = windows_start_mode_lookup StartType AS start_type2 OUTPUTNEW start_mode
LOOKUP-1start_mode_for_eventcode_7045_service_windows = windows_start_mode_lookup StartType AS Service_Start_Type OUTPUTNEW start_mode

EVAL-vendor = "Microsoft"
EVAL-product = "Windows"

