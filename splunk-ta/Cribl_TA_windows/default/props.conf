## CIM aliases for Network Traffic data model — 5152 / 5155 / 5156 / 5157 / 5158
## Firewall events show up in Splunk ES / CIM Network Traffic when these are populated.
FIELDALIAS-cim_src_from_wfp = "EventData.SourceAddress" AS src, "EventData.SourceAddress" AS src_ip
FIELDALIAS-cim_dest_from_wfp = "EventData.DestAddress" AS dest, "EventData.DestAddress" AS dest_ip
FIELDALIAS-cim_src_port_from_wfp = "EventData.SourcePort" AS src_port
FIELDALIAS-cim_dest_port_from_wfp = "EventData.DestPort" AS dest_port
FIELDALIAS-cim_app_from_wfp = "EventData.Application" AS app
FIELDALIAS-cim_transport_from_wfp = "EventData.Protocol" AS transport_number
EVAL-transport = case(transport_number=="6","tcp", transport_number=="17","udp", transport_number=="1","icmp", transport_number=="41","ipv6", transport_number=="47","gre", transport_number=="50","esp", transport_number=="51","ah", transport_number=="58","icmpv6", true(), transport)
EVAL-direction = case(match(LayerName,"Inbound|Receive|Accept"), "inbound", match(LayerName,"Outbound|Connect"), "outbound", Direction=="Inbound","inbound", Direction=="Outbound","outbound", true(),direction)
EVAL-action_wfp = case(EventCode=="5152" OR EventCode=="5157", "blocked", EventCode=="5154" OR EventCode=="5156" OR EventCode=="5158", "allowed", true(), action)

