EVAL-process = case(EventCode==4688, coalesce(if(match(process_command_line_process,"(\\\)"), Process_Command_Line, (if(match(New_Process_Name,"\s"), "\"" + New_Process_Name + "\"", New_Process_Name)) + " " + process_command_line_arguments), New_Process_Name), EventCode==4696, Target_Process_Name , true(), coalesce(Process, process, Process_Name))
EVAL-registry_path = if(EventCode==4657 OR EventCode==4670,Object_Name,registry_path)
EVAL-registry_value_name = if(EventCode==4657, Object_Value_Name, registry_value_name)
EVAL-registry_value_type = if(EventCode==4657, New_Value_Type, registry_value_type)
FIELDALIAS-object_attrs = "Message.Access_Granted.Access_Right" AS object_attrs, "Message.Group.Group_Name" AS object_attrs, "Message.Task_Information.Task_Content" AS object_attrs
EVAL-object_attrs = if(EventCode==4717 OR EventCode==4718,Access_Right,if(isnotnull(Group_Name) AND NOT EventCode IN (4727,4730,4731,4734,4735,4737,4754,4755,4758,4764,4799),Group_Name,if(EventCode IN (4698,4700,4701),TaskContent,if(EventCode==4702,TaskNewContent,if(EventCode==4719, "Category="+Category+",Subcategory="+Subcategory+",Subcategory GUID="+Subcategory_GUID+",Changes="+Changes,object_attrs)))))
EVAL-file_name = if(Object_Type=="File" AND isnotnull(object_file_name),object_file_name,if(isnotnull(Share_Name),Share_Name,file_name))
FIELDALIAS-file_path = "Message.Key_File_Operation_Information.File_Path" AS file_path, "Message.Object.Object_Name" AS file_path, "Message.Share_Information.Share_Path" AS file_path
EVAL-file_path = if(Object_Type=="File" AND isnotnull(object_file_path),object_file_path,if(isnotnull(Share_Path),Share_Path,file_path))

EVAL-parent_process = case(EventCode==4696,Process_Name,true(),parent_process)
FIELDALIAS-parent_process_id = "Message.Object.Handle_ID" AS parent_process_id, "Message.Object.Object_Handle" AS parent_process_id, "Message.Process.Process_ID" AS parent_process_id, "Message.Process_Information.Caller_Process_ID" AS parent_process_id, "Message.Process_Information.Creator_Process_ID" AS parent_process_id, "Message.Process_Information.New_Process_ID" AS parent_process_id
EVAL-parent_process_id = case(EventCode==4688,Creator_Process_ID,EventCode==4696,Process_ID)
EVAL-parent_process_name = case(EventCode==4696,replace(Process_Name,"(?:.*\\\)?(.*)","\1"),true(),parent_process_name)
FIELDALIAS-process_path = "Message.Process.Process_Name" AS process_path, "Message.Process_Information.Caller_Process_Name" AS process_path, "Message.Process_Information.Creator_Process_Name" AS process_path, "Message.Process_Information.New_Process_Name" AS process_path
EVAL-process_path = case(EventCode==4688,New_Process_Name,EventCode==4696,Target_Process_Name,EventCode==4689 OR EventCode==4674 OR EventCode==4673,Process_Name)
FIELDALIAS-parent_process_path = "Message.Process.Process_Name" AS parent_process_path, "Message.Process_Information.Caller_Process_Name" AS parent_process_path, "Message.Process_Information.Creator_Process_Name" AS parent_process_path
EVAL-parent_process_path = case(EventCode==4688,Creator_Process_Name,EventCode==4696,Process_Name)
EVAL-process_exec = case(EventCode==4688,new_process_name,EventCode==4696,target_process_name,EventCode==4689 OR EventCode==4674 OR EventCode==4673,replace(Process_Name,"(?:.*\\\)?(.*)","\1"))
EVAL-process_name = case(EventCode==4688,new_process_name,EventCode==4696,target_process_name,EventCode==4689 OR EventCode==4674 OR EventCode==4673,replace(Process_Name,"(?:.*\\\)?(.*)","\1"),true(),Process_Name)
FIELDALIAS-process_id = "Message.Additional_Information.Return_Code" AS process_id, "Message.Object.Handle_ID" AS process_id, "Message.Object.Object_Handle" AS process_id, "Message.Process.Process_ID" AS process_id, "Message.Process_Information.Caller_Process_ID" AS process_id, "Message.Process_Information.Creator_Process_ID" AS process_id, "Message.Process_Information.New_Process_ID" AS process_id, "Message.Process_Information.Process_ID" AS process_id
EVAL-process_id = case(EventCode==4696,Target_Process_ID, EventCode==4689 OR EventCode==4673, Process_ID, true(), process_id)
FIELDALIAS-process_command_line_arguments = "Message.New_Logon.Account_Name" AS process_command_line_arguments, "Message.Process_Information.Process_Command_Line" AS process_command_line_arguments
FIELDALIAS-process_command_line_process = "Message.Process_Information.New_Process_Name" AS process_command_line_process, "Message.Process_Information.Process_Command_Line" AS process_command_line_process

EVAL-user_type= case(EventCode IN (4741, 4742, 4743), "computer")

