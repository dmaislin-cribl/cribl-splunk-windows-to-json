## REPORT-0MESSAGE / REPORT-MESSAGE pair referenced wel-message / wel-eq-kv /
## wel-col-kv transforms that were never defined in transforms.conf, so they
## have been removed to stop Splunk logging unresolvable-REPORT warnings.

[source::windows:json:System]
TRANSFORMS-force_source_system_ias_for_wineventlog = force_source_system_ias_for_wineventlog

REPORT-bestmatch_for_windows_system = ComputerName_as_dest
