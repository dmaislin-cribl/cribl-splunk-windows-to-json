##
## Cribl_TA_windows - props.conf
## Universal Windows TA. Original sourcetypes/sources preserved.
## KV_MODE=json for Cribl nested JSON extraction.
##
## SECTION INDEX
## 1. Active Directory    [ActiveDirectory]
## 2. DHCP                [DhcpSrvLog]
## 3. Host/Source Fixup   host::, WinEventLog:*, XmlWinEventLog:*
## 4. Windows Event Base  [sourcetype::WinEventLog], [source::XmlWinEventLog...], [sourcetype::windows:json], [source::windows:json...]
## 5. System              source::WinEventLog:System, source::XmlWinEventLog:System
## 6. Security            source::WinEventLog:Security, source::XmlWinEventLog:Security
##    (+ Cribl ETL compat FIELDALIAS/EVAL for nested Message.* JSON — [source::WinEventLog:Security], [wineventlog])
##      and classic rendered flat keys: Message.Authentication_Package, Message.Logon_Account,
##      Message.Source_Workstation, Message.Error_Code (e.g. Security 4776 / credential validation)
## 7. Application         source::WinEventLog:Application, source::XmlWinEventLog:Application
## 8. Windows Update      [WindowsUpdateLog]
## 9. WinRegistry         [WinRegistry]
## 10. WMI / Perfmon      [WMI:*], [Perfmon:*], [PerfmonMk:*] — perf, inventory, scripts
##
## See STRUCTURE.md for full organization.
##

################################################################################
## 1. Active Directory
################################################################################

## Splunk Cloud: [ActiveDirectory] stanza name is blocklisted; sourcetype:: form applies the same at search time.
## userAccountPropertyFlag: decoded from userAccountControl (same rules as former bin script — unknown UAC bits → no field).
## Multivalue field; use mvexpand userAccountPropertyFlag for one row per flag (former Python lookup behavior).
[ActiveDirectory]
EVAL-userAccountPropertyFlag = if(isnull(tonumber(userAccountControl)) OR userAccountControl="" OR tonumber(userAccountControl)==0 OR tonumber(userAccountControl)!=(tonumber(userAccountControl)&100613115), null(), split(rtrim(concat(if((tonumber(userAccountControl)&1)=1,"SCRIPT|",""),if((tonumber(userAccountControl)&2)=2,"ACCOUNTDISABLE|",""),if((tonumber(userAccountControl)&8)=8,"HOMEDIR_REQUIRED|",""),if((tonumber(userAccountControl)&16)=16,"LOCKOUT|",""),if((tonumber(userAccountControl)&32)=32,"PASSWD_NOTREQD|",""),if((tonumber(userAccountControl)&64)=64,"PASSWD_CANT_CHANGE|",""),if((tonumber(userAccountControl)&128)=128,"ENCRYPTED_TEXT_PWD_ALLOWED|",""),if((tonumber(userAccountControl)&256)=256,"TEMP_DUPLICATE_ACCOUNT|",""),if((tonumber(userAccountControl)&512)=512,"NORMAL_ACCOUNT|",""),if((tonumber(userAccountControl)&2048)=2048,"INTERDOMAIN_TRUST_ACCOUNT|",""),if((tonumber(userAccountControl)&4096)=4096,"WORKSTATION_TRUST_ACCOUNT|",""),if((tonumber(userAccountControl)&8192)=8192,"SERVER_TRUST_ACCOUNT|",""),if((tonumber(userAccountControl)&65536)=65536,"DONT_EXPIRE_PASSWORD|",""),if((tonumber(userAccountControl)&131072)=131072,"MNS_LOGON_ACCOUNT|",""),if((tonumber(userAccountControl)&262144)=262144,"SMARTCARD_REQUIRED|",""),if((tonumber(userAccountControl)&524288)=524288,"TRUSTED_FOR_DELEGATION|",""),if((tonumber(userAccountControl)&1048576)=1048576,"NOT_DELEGATED|",""),if((tonumber(userAccountControl)&2097152)=2097152,"USE_DES_KEY_ONLY|",""),if((tonumber(userAccountControl)&4194304)=4194304,"DONT_REQ_PREAUTH|",""),if((tonumber(userAccountControl)&8388608)=8388608,"PASSWORD_EXPIRED|",""),if((tonumber(userAccountControl)&16777216)=16777216,"TRUSTED_TO_AUTH_FOR_DELEGATION|",""),if((tonumber(userAccountControl)&67108864)=67108864,"PARTIAL_SECRETS_ACCOUNT|","")), "|"), "|"))


################################################################################
## 2. DHCP
################################################################################

[DhcpSrvLog]
SHOULD_LINEMERGE = false
MAX_TIMESTAMP_LOOKAHEAD = 20
EVENT_BREAKER_ENABLE = true
TRANSFORMS-0dhcp_discard_headers = dhcp_discard_headers
REPORT-0auto_kv_for_microsoft_dhcp = auto_kv_for_microsoft_dhcp
REPORT_1microsoft_dhcp_dest_dns = microsoft_dhcp_dest_dns
LOOKUP-signature_for_microsoft_dhcp = msdhcp_signature_lookup msdhcp_id OUTPUTNEW signature
FIELDALIAS-windows-dhcp = ip AS dest_ip, mac AS raw_mac, nt_host AS dest_nt_host
FIELDALIAS-win-sign-id = msdhcp_id AS signature_id
FIELDALIAS-dhcp-user = msdhcp_user AS user

EVAL-vendor = "Microsoft"
EVAL-product = "DHCP"
EVAL-vendor_product = "Microsoft DHCP"
EVAL-dest_mac = lower(case(match(raw_mac, "^\w{12,}$"), replace(raw_mac, "^.*(\w{2})(\w{2})(\w{2})(\w{2})(\w{2})(\w{2})$", "\1:\2:\3:\4:\5:\6"), true(), replace(raw_mac, "-|\.|\s", ":")))
EVAL-dest = coalesce(if(nt_host!="BAD_ADDRESS", nt_host, null()), ip, lower(case(match(raw_mac, "^\w{12}$"), rtrim(replace(raw_mac, "(\w{2})", "\1:"), ":"), true(), replace(raw_mac, "-|\.|\s", ":"))))
EVAL-quarantine_info = case(qresult == 0, "NoQuarantine", qresult == 1, "Quarantine", qresult == 2, "Drop Packet", qresult == 3, "Probation", qresult == 6, "No Quarantine Information",  true(), qresult)
EVAL-action = case(msdhcp_id IN (13,15,12,16,18), "blocked", msdhcp_id IN (10,11), "added")
EVAL-dest_nt_host = case(nt_host!="BAD_ADDRESS", nt_host)
EVAL-reason = case(nt_host=="BAD_ADDRESS", nt_host)


################################################################################
## 3. Host/Source Fixup  4. Windows Event Log Base
################################################################################
## Host override for WinEventLog events collected using WEF
[host::WinEventLogForwardHost]
TRANSFORMS-change_host_for_windows_wef = WinEventHostOverride
TRANSFORMS-change_xml_host_for_windows_wef = WinEventXmlHostOverride

## consistent sourcetypes for common extractions XmlWinEventLog or WinEventLog
## format source using sourcetype value, so we know whether its XML or not
## this stanza will ensure the new extractions are backwards compatible; we will know what to do regardless of what source/sourcetype
## the mod input sets and new sources will be accommodated as well
## WinEventLog: classic key=value or JSON. KV_MODE=json for Cribl nested JSON.
## Splunk Cloud: use [sourcetype::WinEventLog] — [source::WinEventLog...] is blocklisted (default source patterns).
[WinEventLog]
TRANSFORMS-Fixup = ta-windows-fix-classic-source,ta-windows-fix-sourcetype
KV_MODE = json
LOOKUP-CategoryString_for_windows = windows_signature_lookup signature_id OUTPUTNEW CategoryString,action,result
FIELDALIAS-category_for_windows = TaskCategory as category
FIELDALIAS-dvc_for_windows = host AS dvc_nt_host, ComputerName as dvc
FIELDALIAS-event_id_for_windows = RecordNumber AS event_id
LOOKUP-1severity_for_windows = windows_severity_lookup Type OUTPUTNEW severity
FIELDALIAS-severity_id_for_windows = EventType AS severity_id
FIELDALIAS-id_for_windows = RecordNumber AS id
REPORT-file_path-file_name_for_windows = file_path-file_name_for_windows
LOOKUP-signature_for_windows3 = windows_signature_lookup signature_id OUTPUTNEW signature,signature AS name, signature AS subject
EVAL-signature_id = if(SourceName="Microsoft-Windows-WindowsUpdateClient",signature_id,EventCode)
FIELDALIAS-user_group_id_for_windows = Primary_Group_ID AS user_group_id
FIELDALIAS-process_for_windows = Process AS process
FIELDALIAS-service_id_for_windows = Service_ID AS service_id, ServiceSid AS service_id
FIELDALIAS-service_for_windows = Service_Name AS service, Service_Name AS service_name, ServiceName AS service, ServiceName AS service_name
EVAL-process_name = if(EventCode==4688, New_Process_Name, Process_Name)
FIELDALIAS-parent_process_for_windows = Creator_Process_Name AS parent_process, ParentProcessName AS parent_process
FIELDALIAS-user_id_for_windows = User_ID AS user_id, UserID AS user_id
EVAL-vendor_product = "Microsoft Windows"
FIELDALIAS-Level = "System.Level" AS Level
FIELDALIAS-Task = "System.Task" AS Task
FIELDALIAS-SubjectUserName = "EventData.SubjectUserName" AS SubjectUserName, "Message.Subject.Account_Name" AS SubjectUserName
FIELDALIAS-SubjectDomainName = "EventData.SubjectDomainName" AS SubjectDomainName, "Message.Subject.Account_Domain" AS SubjectDomainName
FIELDALIAS-SubjectLogonId = "EventData.SubjectLogonId" AS SubjectLogonId, "Message.Subject.Logon_ID" AS SubjectLogonId
FIELDALIAS-TargetUserName = "EventData.TargetUserName" AS TargetUserName, "Message.Target.Account_Name" AS TargetUserName
FIELDALIAS-TargetDomainName = "EventData.TargetDomainName" AS TargetDomainName, "Message.Target.Account_Domain" AS TargetDomainName
FIELDALIAS-TargetServerName = "EventData.TargetServerName" AS TargetServerName
FIELDALIAS-LogonType = "EventData.LogonType" AS LogonType
