            if (isSysmon) {
              if (id === 1) {
                setClass(1007, 1, 'Launch');
                var parent = proc(ED.ParentProcessId, ED.ParentImage, {
                  uid: guid(ED.ParentProcessGuid), cmd_line: nv(ED.ParentCommandLine), user: user(ED.ParentUser) });
                o.process = withIntegrity(proc(ED.ProcessId, ED.Image, {
                  uid: guid(ED.ProcessGuid), cmd_line: nv(ED.CommandLine), working_directory: nv(ED.CurrentDirectory),
                  user: user(ED.User), created_time: msTime(ED.UtcTime), parent_process: parent,
                  session: lid(ED.LogonId) || guid(ED.LogonGuid) ? { uid: lid(ED.LogonId), uuid: guid(ED.LogonGuid) } : null
                }), ED.IntegrityLevel);
                if (o.process) o.process.file = peFile(ED.Image);
                actor(parent ? parent.user : null, parent, null);
              } else if (id === 5) {
                setClass(1007, 2, 'Terminate');
                o.process = proc(ED.ProcessId, ED.Image, { uid: guid(ED.ProcessGuid), user: user(ED.User), terminated_time: msTime(ED.UtcTime) });
              } else if (id === 8 || id === 10 || id === 25) {
                if (id === 8) setClass(1007, 4, 'Inject');
                else if (id === 10) setClass(1007, 3, 'Open');
                else setClass(1007, 99, 'Process Tampering');
                var src = proc(ED.SourceProcessId, ED.SourceImage, { uid: guid(ED.SourceProcessGuid), user: user(ED.SourceUser) });
                o.process = id === 25
                  ? proc(ED.ProcessId, ED.Image, { uid: guid(ED.ProcessGuid), user: user(ED.User) })
                  : proc(ED.TargetProcessId, ED.TargetImage, { uid: guid(ED.TargetProcessGuid), user: user(ED.TargetUser) });
                if (id === 8) {
                  o.injection_type_id = 1; o.injection_type = 'Remote Thread';
                  if (nv(ED.StartModule) || nv(ED.StartAddress)) {
                    o.module = { file: file(ED.StartModule), start_address: nv(ED.StartAddress), function_name: nv(ED.StartFunction),
                                 load_type_id: 0, load_type: 'Unknown' };
                  }
                }
                if (id === 10 && num(ED.GrantedAccess) != null) o.actual_permissions = num(ED.GrantedAccess);
                if (src) actor(src.user, src, null);
              }
            } else if (id === 4688) {
              setClass(1007, 1, 'Launch');
              var parent2 = proc(ED.ProcessId, ED.ParentProcessName);
              // 4688 v2 carries the new process' own token in Target*; older versions only Subject*
              var tu = targetUser();
              o.process = withIntegrity(proc(ED.NewProcessId, ED.NewProcessName, {
                cmd_line: nv(ED.CommandLine), user: tu || subjectUser(), parent_process: parent2,
                session: lid(ED.TargetLogonId) || lid(ED.SubjectLogonId) ? { uid: lid(ED.TargetLogonId) || lid(ED.SubjectLogonId) } : null
              }), ED.MandatoryLabel);
              actor(subjectUser(), parent2, ED.SubjectLogonId);
            } else if (id === 4689) {
              setClass(1007, 2, 'Terminate');
              o.process = proc(ED.ProcessId, ED.ProcessName, { user: subjectUser() });
              if (num(ED.Status) != null) o.exit_code = num(ED.Status);
              actor(subjectUser(), null, ED.SubjectLogonId);
            }
            if (!o.process) o.process = { pid: -1, name: 'Unknown' };
            if (!isSysmon) setStatus(auditOutcome() || 1);
          }

          function mapNetwork() {
            var conn = {};
            if (isSysmon) {
              setClass(4001, 1, 'Open');
              var initiated = String(nv(ED.Initiated) || '').toLowerCase() === 'true';
              // Sysmon reports the initiator as Source; Initiated says whether that was this host
              o.src_endpoint = endpoint(ED.SourceIp, ED.SourcePort, ED.SourceHostname, { svc_name: nv(ED.SourcePortName) });
              o.dst_endpoint = endpoint(ED.DestinationIp, ED.DestinationPort, ED.DestinationHostname, { svc_name: nv(ED.DestinationPortName) });
              conn.direction_id = initiated ? 2 : 1; conn.direction = initiated ? 'Outbound' : 'Inbound';
              var pn = String(nv(ED.Protocol) || '').toLowerCase();
              if (pn) { conn.protocol_name = pn; conn.protocol_num = PROTO_NUM[pn]; }
              var v6 = String(nv(ED.SourceIsIpv6) || '').toLowerCase() === 'true';
              conn.protocol_ver_id = v6 ? 6 : 4; conn.protocol_ver = v6 ? 'Internet Protocol version 6 (IPv6)' : 'Internet Protocol version 4 (IPv4)';
              var p = proc(ED.ProcessId, ED.Image, { uid: guid(ED.ProcessGuid), user: user(ED.User) });
              actor(p ? p.user : null, p, null);
              setAction(3, 17);
            } else {
              var WFP = { 5156: [1, 'Open', 1, 1], 5157: [5, 'Refuse', 2, 2], 5152: [5, 'Refuse', 2, 6],
                          5154: [7, 'Listen', 1, 1], 5155: [7, 'Listen', 2, 2], 5158: [99, 'Bind', 1, 1], 5159: [99, 'Bind', 2, 2] };
              var w = WFP[id];
              setClass(4001, w[0], w[1]);
              setAction(w[2], w[3]);
              var dir = String(nv(ED.Direction) || '').toLowerCase();
              var local = endpoint(ED.SourceAddress, ED.SourcePort, null);
              var remote = endpoint(ED.DestAddress, ED.DestPort, null);
              if (id === 5154 || id === 5155 || id === 5158 || id === 5159) {
                // Listen / bind: only the local endpoint exists — it is the responder
                local.hostname = S.computer;
                o.dst_endpoint = local;
              } else if (dir === 'inbound') {
                // WFP always reports the local side as "Source". For inbound traffic the
                // remote peer is the initiator, so swap to OCSF src (initiator) / dst (responder).
                local.hostname = S.computer;
                o.src_endpoint = remote; o.dst_endpoint = local;
              } else {
                local.hostname = S.computer;
                o.src_endpoint = local; o.dst_endpoint = remote;
              }
              if (dir === 'inbound') { conn.direction_id = 1; conn.direction = 'Inbound'; }
              else if (dir === 'outbound') { conn.direction_id = 2; conn.direction = 'Outbound'; }
              else if (dir) { conn.direction_id = 99; conn.direction = nv(ED.Direction); }
              else { conn.direction_id = 0; conn.direction = 'Unknown'; }
              var pnum = num(ED.Protocol);
              if (pnum != null) { conn.protocol_num = pnum; conn.protocol_name = IANA_PROTO[pnum]; }
              var anyIp = (o.src_endpoint && o.src_endpoint.ip) || (o.dst_endpoint && o.dst_endpoint.ip);
              if (anyIp) {
                var v6w = anyIp.indexOf(':') >= 0;
                conn.protocol_ver_id = v6w ? 6 : 4; conn.protocol_ver = v6w ? 'Internet Protocol version 6 (IPv6)' : 'Internet Protocol version 4 (IPv4)';
              }
              actor(null, proc(first(ED.ProcessID, ED.ProcessId), ED.Application), null);
              if (nv(ED.FilterRTID) && nv(ED.FilterRTID) !== '0') o.firewall_rule = { uid: nv(ED.FilterRTID), name: nv(ED.FilterName) || null };
              setStatus(auditOutcome() || 1);
            }
            var sip = o.src_endpoint && o.src_endpoint.ip, dip = o.dst_endpoint && o.dst_endpoint.ip;
            if (sip && dip && isLoopback(sip) && isLoopback(dip)) { conn.boundary_id = 1; conn.boundary = 'Localhost'; }
            if (conn.direction_id == null) { conn.direction_id = 0; conn.direction = 'Unknown'; }
            o.connection_info = conn;
          }

          function mapDns() {
            setClass(4003, 6, 'Traffic');
            o.query = { hostname: nv(ED.QueryName) || 'unknown' };
            o.query_time = msTime(ED.UtcTime);
            // QueryResults: "type:  5 alias.example.com;::ffff:10.0.0.5;fe80::1;"
            var DNS_TYPES = { 1: 'A', 2: 'NS', 5: 'CNAME', 6: 'SOA', 12: 'PTR', 15: 'MX', 16: 'TXT', 28: 'AAAA', 33: 'SRV', 65: 'HTTPS' };
            var qr = nv(ED.QueryResults);
            if (qr) {
              var ans = [];
              var parts = qr.split(';');
              for (var i = 0; i < parts.length; i++) {
                var s = parts[i].trim();
                if (!s) continue;
                var m = /^type:\s*(\d+)\s+(.*)$/.exec(s);
                if (m) ans.push({ type: DNS_TYPES[m[1]] || String(m[1]), rdata: m[2] });
                else {
                  var ip = cleanIp(s);
                  if (ip) ans.push({ type: ip.indexOf(':') >= 0 ? 'AAAA' : 'A', rdata: ip });
                  else ans.push({ rdata: s });
                }
              }
              if (ans.length) o.answers = ans;
            }
            // QueryStatus is a Win32 error code; map the DNS_ERROR_RCODE_* range to OCSF rcode
            var qs = num(ED.QueryStatus);
            var RC = { 0: [0, 'NoError'], 9001: [1, 'FormError'], 9002: [2, 'ServError'], 9003: [3, 'NXDomain'], 9004: [4, 'NotImp'], 9005: [5, 'Refused'],
                       9006: [6, 'YXDomain'], 9007: [7, 'YXRRSet'], 9008: [8, 'NXRRSet'], 9009: [9, 'NotAuth'], 9010: [10, 'NotZone'] };
            if (qs != null) {
              var rc = RC[qs] || [99, 'Other'];
              o.rcode_id = rc[0]; o.rcode = rc[1];
              if (qs === 0) setStatus(1, '0'); else setStatus(2, String(qs));
            }
            o.src_endpoint = endpoint(null, null, S.computer);
            var p = proc(ED.ProcessId, ED.Image, { uid: guid(ED.ProcessGuid), user: user(ED.User) });
            actor(p ? p.user : null, p, null);
          }

          // Security 4656/4663 AccessMask → File System activity (most significant right wins)
          function fileActivityFromMask(mask) {
            if (mask == null) return [99, 'Other'];
            if (mask & 0x10000) return [4, 'Delete'];
            if (mask & 0xC0000) return [7, 'Set Security'];
            if (mask & 0x6) return [3, 'Update'];
            if (mask & 0x110) return [6, 'Set Attributes'];
            if (mask & 0x1) return [2, 'Read'];
            if (mask & 0x88) return [8, 'Get Attributes'];
            if (mask & 0x20000) return [9, 'Get Security'];
            return [99, 'Other'];
          }
          function regActivityFromMask(mask) {
            if (mask == null) return [99, 'Other'];
            if (mask & 0x10000) return [4, 'Delete'];
            if (mask & 0xC0000) return [6, 'Set Security'];
            if (mask & 0x4) return [1, 'Create'];
            if (mask & 0x2) return [3, 'Modify'];
            if (mask & 0x19) return [2, 'Read'];
            return [99, 'Other'];
          }

          function mapObjectAccess() {
            // 4656 / 4663 / 4670 — File System or Registry Key depending on ObjectType
            var objType = String(nv(ED.ObjectType) || '').toLowerCase();
            var mask = num(ED.AccessMask);
            var subj = subjectUser();
            var p = proc(first(ED.ProcessId, ED.ProcessID), ED.ProcessName);
            if (objType === 'key') {
              var ra = id === 4670 ? [6, 'Set Security'] : regActivityFromMask(mask);
              setClass(201001, ra[0], ra[1]);
              o.reg_key = { path: nv(ED.ObjectName) || 'unknown', security_descriptor: id === 4670 ? nv(ED.NewSd) : null };
              if (id === 4670 && nv(ED.OldSd)) o.prev_reg_key = { path: o.reg_key.path, security_descriptor: nv(ED.OldSd) };
              if (mask != null) o.access_mask = mask;
            } else {
              var fa = id === 4670 ? [7, 'Set Security'] : id === 4656 ? [14, 'Open'] : fileActivityFromMask(mask);
              setClass(1001, fa[0], fa[1]);
              o.file = file(ED.ObjectName) || { name: 'unknown', type_id: 0, type: 'Unknown' };
              if (id === 4670) {
                o.file.security_descriptor = nv(ED.NewSd);
              }
              if (mask != null) o.access_mask = mask;
            }
            actor(subj, p, ED.SubjectLogonId);
            setStatus(auditOutcome() || 1);
          }

          function mapRegistryValue4657() {
            var op = String(nv(ED.OperationType) || '').toLowerCase();
            var ra = op.indexOf('created') >= 0 || op === '%%1904' ? [2, 'Set']
                   : op.indexOf('deleted') >= 0 || op === '%%1906' ? [4, 'Delete'] : [3, 'Modify'];
            setClass(201002, ra[0], ra[1]);
            var keyPath = nv(ED.ObjectName) || 'unknown';
            var vname = nv(ED.ObjectValueName) || '(Default)';
            o.reg_value = regValue(keyPath + '\\' + vname, vname, ED.NewValueType, ED.NewValue);
            if (ra[0] !== 2 && (nv(ED.OldValue) != null || nv(ED.OldValueType) != null)) {
              o.prev_reg_value = regValue(keyPath + '\\' + vname, vname, ED.OldValueType, ED.OldValue);
            }
            actor(subjectUser(), proc(first(ED.ProcessId, ED.ProcessID), ED.ProcessName), ED.SubjectLogonId);
            setStatus(auditOutcome() || 1);
          }

          var REG_TYPES = { REG_BINARY: 1, REG_DWORD: 2, REG_DWORD_BIG_ENDIAN: 3, REG_EXPAND_SZ: 4, REG_LINK: 5, REG_MULTI_SZ: 6,
                            REG_NONE: 7, REG_QWORD: 8, REG_QWORD_LITTLE_ENDIAN: 9, REG_SZ: 10 };
          function regValue(path, name, type, data) {
            var t = String(nv(type) || '').toUpperCase().replace(/\s.*$/, '');
            if (t && !/^REG_/.test(t)) t = 'REG_' + t;
            var v = { path: path, name: name, data: nv(data), is_default: name === '(Default)' };
            if (REG_TYPES[t]) { v.type_id = REG_TYPES[t]; v.type = t; }
            return v;
          }

          function mapSysmonFileOrRegistry() {
            var p = proc(ED.ProcessId, ED.Image, { uid: guid(ED.ProcessGuid), user: user(ED.User) });
            actor(p ? p.user : null, p, null);
            if (id === 11 || id === 15) {
              setClass(1001, 1, 'Create');
              o.file = file(ED.TargetFilename, { created_time: msTime(ED.CreationUtcTime), hashes: hashes(ED.Hash || ED.Hashes) });
            } else if (id === 23 || id === 26) {
              setClass(1001, 4, 'Delete');
              o.file = file(ED.TargetFilename, { hashes: hashes(ED.Hashes), is_deleted: true });
            } else if (id === 2) {
              // Timestomp: file = before, file_result = after
              setClass(1001, 6, 'Set Attributes');
              o.file = file(ED.TargetFilename, { created_time: msTime(ED.PreviousCreationUtcTime) });
              o.file_result = file(ED.TargetFilename, { created_time: msTime(ED.CreationUtcTime) });
            } else if (id === 12 || id === 13 || id === 14) {
              var et = String(nv(ED.EventType) || '').toLowerCase();
              var target = nv(ED.TargetObject) || 'unknown';
              var leaf = target.split('\\').pop() || '(Default)';
              if (id === 13 || et === 'setvalue') {
                setClass(201002, 2, 'Set');
                // Details: "DWORD (0x00000001)", "QWORD (0x...)", "Binary Data", or the string value
                var det = nv(ED.Details);
                var dm = det ? /^(DWORD|QWORD) \((0x[0-9a-f]+)(?:-(0x[0-9a-f]+))?\)$/i.exec(det) : null;
                var rv = { path: target, name: leaf, is_default: leaf === '(Default)' };
                if (dm) { rv.type = 'REG_' + dm[1].toUpperCase(); rv.type_id = REG_TYPES[rv.type]; rv.data = det; }
                else if (det === 'Binary Data') { rv.type = 'REG_BINARY'; rv.type_id = 1; }
                else if (det != null) rv.data = det;
                o.reg_value = rv;
              } else if (et === 'deletevalue') {
                setClass(201002, 4, 'Delete');
                o.reg_value = { path: target, name: leaf, is_default: leaf === '(Default)' };
              } else if (id === 14 || et.indexOf('rename') === 0) {
                setClass(201001, 5, 'Rename');
                o.prev_reg_key = { path: target };
                o.reg_key = { path: nv(ED.NewName) || target };
              } else {
                var ka = et === 'deletekey' ? [4, 'Delete'] : [1, 'Create'];
                setClass(201001, ka[0], ka[1]);
                o.reg_key = { path: target };
              }
            }
          }

          function mapModule() {
            if (id === 6) {
              setClass(1002, 1, 'Load');
              o.driver = { file: peFile(ED.ImageLoaded) || { name: 'unknown', type_id: 0, type: 'Unknown' } };
            } else {
              setClass(1005, 1, 'Load');
              o.module = { file: peFile(ED.ImageLoaded), load_type_id: 1, load_type: 'Standard' };
              var p = proc(ED.ProcessId, ED.Image, { uid: guid(ED.ProcessGuid), user: user(ED.User) });
              actor(p ? p.user : null, p, null);
            }
          }

          function mapScheduledJob() {
            var ACT = { 4698: [1, 'Create'], 4699: [3, 'Delete'], 4700: [4, 'Enable'], 4701: [5, 'Disable'], 4702: [2, 'Update'] };
            setClass(1006, ACT[id][0], ACT[id][1]);
            var taskName = nv(ED.TaskName) || '\\unknown';
            var xml = String(first(ED.TaskContentNew, ED.TaskContent) || '')
              .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
            function tag(t) { var m = new RegExp('<' + t + '>([\\s\\S]*?)</' + t + '>').exec(xml); return m ? m[1].trim() : null; }
            var cmd = tag('Command'), args = tag('Arguments');
            // The job's definition lives at %SystemRoot%\System32\Tasks\<TaskName>
            o.job = {
              name: taskName,
              file: file('C:\\Windows\\System32\\Tasks' + (taskName.charAt(0) === '\\' ? '' : '\\') + taskName),
              cmd_line: cmd ? (args ? cmd + ' ' + args : cmd) : null,
              desc: tag('Description'),
              user: user(tag('UserId'))
            };
            actor(subjectUser(), null, ED.SubjectLogonId);
            setStatus(auditOutcome() || 1);
          }

          function mapService() {
            var name, cmd, stype, start, acct;
            if (id === 7040) {
              setClass(201004, 2, 'Reconfigure');
              name = first(ED.param4, ED.param1, ED.Data && ED.Data[0]);
              start = first(ED.param3, ED.Data && ED.Data[2]);
            } else {
              setClass(201004, 1, 'Create');
              name = nv(ED.ServiceName);
              cmd = first(ED.ServiceFileName, ED.ImagePath);
              stype = first(ED.ServiceType);
              start = first(ED.ServiceStartType, ED.StartType);
              acct = first(ED.ServiceAccount, ED.AccountName);
            }
            var svc = { name: name || 'unknown', cmd_line: cmd, service_start_name: acct };
            // ServiceType: 4697 = hex bitmask, 7045 = text
            var stn = num(stype), sts = String(stype || '').toLowerCase();
            var ST = stn != null ? ((stn & 0x1) ? [1, 'Kernel Driver'] : (stn & 0x2) ? [2, 'File System Driver']
                                 : (stn & 0x10) ? [3, 'Own Process'] : (stn & 0x20) ? [4, 'Share Process'] : [99, String(stype)])
                   : sts.indexOf('kernel') >= 0 ? [1, 'Kernel Driver'] : sts.indexOf('file system') >= 0 ? [2, 'File System Driver']
                   : sts.indexOf('own process') >= 0 ? [3, 'Own Process'] : sts.indexOf('share') >= 0 ? [4, 'Share Process']
                   : sts ? [99, nv(stype)] : null;
            if (ST) {
              svc.service_type_id = ST[0]; svc.service_type = ST[1];
              svc.service_category_id = ST[0] === 1 || ST[0] === 2 ? 1 : ST[0] === 3 || ST[0] === 4 ? 2 : 0;
              svc.service_category = { 0: 'Unknown', 1: 'Kernel Mode', 2: 'User Mode' }[svc.service_category_id];
              if (ST[0] === 99 && /user mode/i.test(sts)) { svc.service_category_id = 2; svc.service_category = 'User Mode'; }
            }
            // StartType: 4697 = 0..4, 7045/7040 = text
            var sn = num(start), ss = String(start || '').toLowerCase();
            var SS = sn != null ? ({ 0: [1, 'Boot'], 1: [2, 'System'], 2: [3, 'Auto'], 3: [4, 'Demand'], 4: [5, 'Disabled'] }[sn] || [99, String(start)])
                   : ss.indexOf('boot') >= 0 ? [1, 'Boot'] : ss.indexOf('system') >= 0 ? [2, 'System'] : ss.indexOf('auto') >= 0 ? [3, 'Auto']
                   : ss.indexOf('demand') >= 0 || ss.indexOf('manual') >= 0 ? [4, 'Demand'] : ss.indexOf('disabled') >= 0 ? [5, 'Disabled']
                   : ss ? [99, nv(start)] : null;
            if (SS) { svc.service_start_type_id = SS[0]; svc.service_start_type = SS[1]; }
            if (svc.cmd_line == null && svc.service_start_type_id == null && svc.service_type_id == null && svc.service_start_name == null) {
              svc.service_category_id = 0; svc.service_category = 'Unknown';
            }
            o.win_service = svc;
            var su = subjectUser() || user(null, null, S.userSid);
            actor(su, null, ED.SubjectLogonId);
            if (isSecurity) setStatus(auditOutcome() || 1);
          }

          function mapEventLog() {
            var ACT = { 1102: [1, 'Clear'], 104: [1, 'Clear'], 1100: [7, 'Stop'] };
            setClass(1008, ACT[id][0], ACT[id][1]);
            o.log_name = id === 104 ? (nv(ED.Channel) || S.channel) : 'Security';
            o.log_provider = S.provider || 'Microsoft-Windows-Eventlog';
            o.log_type_id = 1; o.log_type = 'OS';
            if (id === 104 && nv(ED.BackupPath)) o.file = file(ED.BackupPath);
            o.dst_endpoint = endpoint(null, null, S.computer);
            actor(subjectUser(), null, ED.SubjectLogonId);
            setStatus(1);
          }

          function mapScript() {
            setClass(1009, 1, 'Execute');
            var path = nv(ED.Path);
            o.script = {
              script_content: { value: String(ED.ScriptBlockText == null ? '' : ED.ScriptBlockText) },
              type_id: 2, type: 'PowerShell',
              uid: guid(ED.ScriptBlockId),
              name: path ? basename(path) : null,
              file: path ? file(path) : null
            };
            actor(user(null, null, S.userSid), S.pid != null ? { pid: S.pid } : null, null);
          }

          // ---------- dispatch ----------
          var AUTH = [4624, 4625, 4634, 4647, 4648, 4768, 4769, 4770, 4771, 4772, 4773, 4776, 4778, 4779];
          var ACCT = [4720, 4722, 4723, 4724, 4725, 4726, 4738, 4740, 4741, 4742, 4743, 4767, 4781];
          var GROUP_IDS = [4727, 4728, 4729, 4730, 4731, 4732, 4733, 4734, 4735, 4737,
                           4744, 4745, 4746, 4747, 4748, 4749, 4750, 4751, 4752, 4753, 4754, 4755, 4756, 4757, 4758,
                           4759, 4760, 4761, 4762, 4763];
          var mapped = true;
          var objTypeLc = String(nv(ED.ObjectType) || '').toLowerCase();
          if (isSysmon) {
            if ([1, 5, 8, 10, 25].indexOf(id) >= 0) mapProcess();
            else if (id === 3) mapNetwork();
            else if (id === 22) mapDns();
            else if ([2, 11, 12, 13, 14, 15, 23, 26].indexOf(id) >= 0) mapSysmonFileOrRegistry();
            else if (id === 6 || id === 7) mapModule();
            else mapped = false;
          } else if (isSecurity) {
            if (AUTH.indexOf(id) >= 0) mapAuthentication();
            else if (ACCT.indexOf(id) >= 0) mapAccountChange();
            else if (GROUP_IDS.indexOf(id) >= 0) mapGroupManagement();
            else if (id === 4704 || id === 4705) mapUserAccess();
            else if (id === 4672) mapAuthorizeSession();
            else if (id === 4688 || id === 4689) mapProcess();
            else if ([5152, 5154, 5155, 5156, 5157, 5158, 5159].indexOf(id) >= 0) mapNetwork();
            else if ((id === 4656 || id === 4663 || id === 4670) && (objTypeLc === 'file' || objTypeLc === 'key')) mapObjectAccess();
            else if (id === 4657) mapRegistryValue4657();
            else if (id >= 4698 && id <= 4702) mapScheduledJob();
            else if (id === 4697) mapService();
            else if (id === 1102 || id === 1100) mapEventLog();
            else mapped = false;
          } else if (chan === 'system' && (id === 7045 || id === 7040) && /service control manager/.test(provLc)) {
            mapService();
          } else if (chan === 'system' && id === 104 && /eventlog/.test(provLc)) {
            mapEventLog();
          } else if (id === 4104 && /powershell/.test(chan + ' ' + provLc)) {
            mapScript();
          } else {
            mapped = false;
          }
          if (!mapped) {
            // activity_name carries the source value (task category, else the event id)
            var taskName = nv(SYS_REST.Task);
            setClass(0, 99, taskName && !/^\d+$/.test(taskName) ? taskName : 'Windows Event ' + (id != null ? id : 'Unknown'));
            var su0 = subjectUser() || user(null, null, S.userSid);
            if (su0) actor(su0, null, ED.SubjectLogonId);
            var ao0 = auditOutcome();
            if (ao0) setStatus(ao0);
          }

          // ---------- common attributes ----------
          // Severity from Windows Level: 1 Critical→5, 2 Error→4, 3 Warning→3, 0/4/5 → Informational
          var SEV = { 0: 1, 1: 5, 2: 4, 3: 3, 4: 1, 5: 1 };
          o.severity_id = S.level != null && SEV[S.level] != null ? SEV[S.level] : (S.level == null ? 1 : 99);
          o.severity = SEVERITY_NAMES[o.severity_id];
          o.message = S.message || (isSysmon ? SYSMON_MSG[id] : MSG[id]) || null;
          o.time = __e._time != null ? Math.round(Number(__e._time) * 1000) : Date.now();  // re-stamped after Auto Timestamp

          var fqdn = S.computer;
          o.device = {
            hostname: fqdn,
            name: fqdn ? fqdn.split('.')[0] : null,
            domain: fqdn && fqdn.indexOf('.') > 0 ? fqdn.substring(fqdn.indexOf('.') + 1) : null,
            type_id: 0, type: 'Unknown',
            os: { name: 'Windows', type_id: 100, type: 'Windows' }
          };
          if (!o.device.hostname) o.device.name = nv(__e.host) || 'unknown';

          var md = {
            version: OCSF_VERSION,
            product: {
              name: isSysmon ? 'Sysmon' : 'Windows',
              vendor_name: 'Microsoft',
              feature: S.provider ? { name: S.provider } : null
            },
            log_name: S.channel,
            log_provider: S.provider,
            log_level: S.levelName || (S.level != null ? WIN_LEVEL_NAMES[S.level] : null),
            event_code: id != null ? String(id) : null,
            uid: S.recordId,
            correlation_uid: guid(S.correlation),
            original_time: S.timeCreated,
            processed_time: Date.now(),
            profiles: profiles
          };
          if (extension) md.extensions = [extension];
          o.metadata = md;

          if (CFG.includeUnmapped) {
            o.unmapped = { EventData: ED, System: SYS_REST };
          }
          if (CFG.includeRawData) o.raw_data = raw;

          // ---------- observables (OCSF observable type_id) ----------
          var obs = [], seen = {};
          function addObs(name, typeId, typeName, value) {
            if (value == null || value === '') return;
            var k = name + '|' + value;
            if (seen[k]) return;
            seen[k] = 1;
            obs.push({ name: name, type_id: typeId, type: typeName, value: String(value) });
          }
          function get(path) {
            var cur = o, ps = path.split('.');
            for (var i = 0; i < ps.length; i++) { if (cur == null || typeof cur !== 'object') return null; cur = cur[ps[i]]; }
            return cur;
          }
          var OBS_PATHS = [
            ['device.hostname', 1, 'Hostname'], ['src_endpoint.hostname', 1, 'Hostname'], ['dst_endpoint.hostname', 1, 'Hostname'],
            ['query.hostname', 1, 'Hostname'],
            ['src_endpoint.ip', 2, 'IP Address'], ['dst_endpoint.ip', 2, 'IP Address'],
            ['user.name', 4, 'User Name'], ['actor.user.name', 4, 'User Name'], ['process.user.name', 4, 'User Name'],
            ['file.name', 7, 'File Name'], ['process.file.name', 7, 'File Name'], ['module.file.name', 7, 'File Name'],
            ['process.name', 9, 'Process Name'], ['actor.process.name', 9, 'Process Name'], ['process.parent_process.name', 9, 'Process Name'],
            ['process.cmd_line', 13, 'Command Line'], ['job.cmd_line', 13, 'Command Line'], ['win_service.cmd_line', 13, 'Command Line'],
            ['user.uid', 31, 'User Object: uid'], ['actor.user.uid', 31, 'User Object: uid'],
            ['group.name', 32, 'Group Object: name'], ['group.uid', 33, 'Group Object: uid']
          ];
          for (var oi = 0; oi < OBS_PATHS.length; oi++) addObs(OBS_PATHS[oi][0], OBS_PATHS[oi][1], OBS_PATHS[oi][2], get(OBS_PATHS[oi][0]));
          var HASH_PATHS = ['process.file', 'file', 'module.file', 'driver.file'];
          for (var hi = 0; hi < HASH_PATHS.length; hi++) {
            var hs = get(HASH_PATHS[hi] + '.hashes');
            if (Array.isArray(hs)) for (var hj = 0; hj < hs.length; hj++) addObs(HASH_PATHS[hi] + '.hashes.value', 8, 'Hash', hs[hj].value);
          }
          if (obs.length) o.observables = obs;

          // ---------- prune null / empty (OCSF: omit attributes with no value) ----------
          function prune(x, depth) {
            if (x == null || depth > 12) return x == null ? undefined : x;
            if (Array.isArray(x)) {
              var a = [];
              for (var i = 0; i < x.length; i++) { var v = prune(x[i], depth + 1); if (v !== undefined) a.push(v); }
              return a.length ? a : undefined;
            }
            if (typeof x === 'object') {
              var r = {}, n = 0, ks = Object.keys(x);
              for (var j = 0; j < ks.length; j++) {
                var pv = prune(x[ks[j]], depth + 1);
                if (pv !== undefined && pv !== '') { r[ks[j]] = pv; n++; }
              }
              return n ? r : undefined;
            }
            if (typeof x === 'number' && isNaN(x)) return undefined;
            return x;
          }
          // unmapped is kept verbatim (it is the lossless copy); everything else is pruned
          var keepUnmapped = o.unmapped;
          delete o.unmapped;
          o = prune(o, 0) || {};
          if (keepUnmapped) o.unmapped = keepUnmapped;

          __e.__ocsf = o;
          __e.__ocsf_class_uid = o.class_uid;
          __e.__ocsf_class_name = o.class_name;
          __e.__ocsf_channel = String(S.channel || 'Unknown').trim().replace(/\s+/g, '_');

        } catch (err) {
          // Unparseable / unmappable: keep _raw untouched and tag it so it is easy to find
          __e.cribl_code_error = String(err);
          __e.sourcetype = 'ocsf:parse_error';
          __e.__time_utc = false;
          __e.__ocsf = undefined;
        }
    description: Parse Windows Event (XML or Classic text) and map it to an OCSF 1.4.0 class in __ocsf
  - id: lookup
    filter: "true"
    disabled: false
    conf:
      dbLookup: false
      matchMode: regex
      matchType: specific
      reloadPeriodSec: -1
      inFields:
        - eventField: host
          lookupField: host
      addToEvent: false
      ignoreCase: false
      file: host_timezone.csv
      outFields:
        - eventField: __tz
          lookupField: tz
    description: Per-host timezone for Classic timestamps that carry no offset
  - id: auto_timestamp
    filter: "true"
    disabled: false
    conf:
      srcField: _time
      dstField: _time
      defaultTimezone: utc
      # Shift by the host_timezone offset only when the Code step did not mark
      # _time as authoritative UTC (XML SystemTime, Classic strings with an offset).
      timeExpression: "(__tz && !__time_utc) ? C.Time.adjustTZ(time.getTime(),
        'UTC', __tz) / 1000 : time.getTime() / 1000"
      offset: 0
      maxLen: 150
      defaultTime: now
      latestDateAllowed: +1week
      earliestDateAllowed: -420weeks
      timestamps:
        - regex: /(.*)/
          strptime: "%s"
    description: Use the correct "generated time" as the timestamp for the event.
  - id: code
    filter: "__ocsf != null"
    disabled: false
    conf:
      maxNumOfIterations: 5000
      activeLogSampleRate: 1
      useUniqueLogChannel: false
      code: |-
        // Emit OCSF — runs after Auto Timestamp so OCSF time uses the final _time.
        //   ocsfOutputMode 'raw'    (default) _raw = OCSF JSON; only _raw/_time/host/source/sourcetype/index kept
        //   ocsfOutputMode 'fields' OCSF attributes become top-level event fields and _raw is removed
        //                           (use for Parquet / Amazon Security Lake / Cribl Lake destinations)
        var o = __e.__ocsf;
        if (o && typeof o === 'object') {
          var mode = 'raw';
          try { if (C.vars && C.vars.ocsfOutputMode) mode = String(C.vars.ocsfOutputMode).toLowerCase(); } catch (e) { /* default */ }

          if (__e._time != null && !isNaN(Number(__e._time))) o.time = Math.round(Number(__e._time) * 1000);

          var KEEP = mode === 'fields' ? { _time: 1 } : { _raw: 1, _time: 1, host: 1, source: 1, sourcetype: 1, index: 1 };
          var ks = Object.keys(__e);
          for (var i = 0; i < ks.length; i++) {
            var k = ks[i];
            if (KEEP[k] || k.indexOf('__') === 0 || k.indexOf('cribl_') === 0) continue;
            delete __e[k];
          }
          if (mode === 'fields') {
            var ok = Object.keys(o);
            for (var j = 0; j < ok.length; j++) __e[ok[j]] = o[ok[j]];
          } else {
            __e._raw = JSON.stringify(o);
            __e.sourcetype = 'ocsf';
            __e.source = 'windows:ocsf:' + (__e.__ocsf_channel || 'Unknown');
          }
          __e.__ocsf = undefined;
        }
    description: Emit OCSF - set time from final _time and write _raw (raw mode) or top-level fields (fields mode)
description: Windows Event Log (XML and Classic) to OCSF 1.4.0
