output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
functions:
  - id: comment
    filter: "true"
    conf:
      comment: |-
        Windows Events to OCSF 1.4.0

        Same XML / Classic parser as Windows_Events_to_Nested_JSON, then maps each event to an
        OCSF 1.4.0 class: Authentication, Account Change, Group Management, Process, Network,
        DNS, File System, Registry (win), Windows Service (win), Scheduled Job, Module, Kernel
        Extension, Event Log, Script. Unmapped event IDs become Base Event (class_uid 0).

        ocsfOutputMode 'raw' (default): _raw = OCSF JSON, sourcetype=ocsf.
        ocsfOutputMode 'fields': OCSF attributes as top-level fields (Parquet / Security Lake).
        Full EventData is kept in unmapped. Parse failures: sourcetype=ocsf:parse_error.
        Mapping table: README "OCSF pipeline".
    description: Pipeline overview
  - id: code
    filter: "true"
    disabled: false
    conf:
      maxNumOfIterations: 5000
      activeLogSampleRate: 1
      useUniqueLogChannel: false
      code: |-
        // Windows Events to OCSF 1.4.0 — Universal Parser + OCSF Mapper
        // Parses XML (WEC/WEF/Sysmon/Edge) and Classic rendered text exactly like the
        // Windows_Events_to_Nested_JSON pipeline, then maps the result to an OCSF
        // 1.4.0 event class. The OCSF object is left in __ocsf; the "Emit OCSF" Code
        // function further down writes it out once _time is final.
        //
        // Two stages:
        //   1. PARSE     — parseWinEvent/clean() or parseClassic(), %%NNNN resolution
        //                  (same logic as the nested-JSON pipeline).
        //   2. NORMALIZE — Classic Message sections are translated to the XML
        //                  EventData names (Subject.Account_Name -> SubjectUserName,
        //                  New_Logon.Security_ID -> TargetUserSid, ...), so a single
        //                  mapping table serves both formats.
        //   3. MAP       — Event ID -> OCSF class/activity; per-class builders fill
        //                  the class attributes. Anything not explicitly mapped goes
        //                  to Base Event (class_uid 0). Nothing is dropped: the full
        //                  EventData lands in unmapped.EventData.
        //
        // Class coverage (OCSF 1.4.0, Windows extension "win" uid 2 where noted):
        //   3002 Authentication         4624 4625 4634 4647 4648 4768 4769 4770 4771
        //                               4772 4773 4776 4778 4779
        //   3001 Account Change         4720 4722 4723 4724 4725 4726 4738 4740 4741
        //                               4742 4743 4767 4781
        //   3006 Group Management       4727-4737 4744-4763
        //   3005 User Access Mgmt       4704 4705
        //   3003 Authorize Session      4672
        //   1007 Process Activity       4688 4689, Sysmon 1 5 8 10 25
        //   4001 Network Activity       5152 5154 5155 5156 5157 5158 5159, Sysmon 3
        //   4003 DNS Activity           Sysmon 22
        //   1001 File System Activity   4656 4663 4670 (ObjectType File), Sysmon 2 11 15 23 26
        //   1005 Module Activity        Sysmon 7
        //   1002 Kernel Extension       Sysmon 6
        //   1006 Scheduled Job          4698 4699 4700 4701 4702
        //   1008 Event Log Activity     1100 1102 (Security), 104 (System)
        //   1009 Script Activity        PowerShell 4104
        //   201001 Registry Key (win)   4656 4663 4670 (ObjectType Key), Sysmon 12 14
        //   201002 Registry Value (win) 4657, Sysmon 12 (DeleteValue) 13
        //   201004 Windows Service (win) 4697, 7045, 7040
        //   0    Base Event             everything else
        //
        // Settings (pack variables, see default/vars.yml):
        //   ocsfIncludeUnmapped (Boolean) default true  — keep EventData/System leftovers in unmapped
        //   ocsfIncludeRawData  (Boolean) default false — copy the original _raw into raw_data
        //   resolveWinCodes     (Boolean) default true  — resolve %%NNNN message-file codes

        try {
          const raw = (__e._raw || '').trim();

          // ---------------------------------------------------------------
          // Configuration (with optional Variable overrides)
          // ---------------------------------------------------------------
          var CFG = {
            resolveWinCodes: true,
            includeUnmapped: true,
            includeRawData: false
          };
          function boolVar(v, dflt) {
            if (v === undefined || v === null || v === '') return dflt;
            return v === true || String(v).toLowerCase() === 'true';
          }
          try {
            if (typeof C !== 'undefined' && C && C.vars) {
              CFG.resolveWinCodes = boolVar(C.vars.resolveWinCodes, CFG.resolveWinCodes);
              CFG.includeUnmapped = boolVar(C.vars.ocsfIncludeUnmapped, CFG.includeUnmapped);
              CFG.includeRawData = boolVar(C.vars.ocsfIncludeRawData, CFG.includeRawData);
            }
          } catch (cfgErr) { /* Variables unavailable — use defaults */ }

          // ===============================================================
          // STAGE 1 — PARSE (same logic as Windows_Events_to_Nested_JSON)
          // ===============================================================

          // Windows message-code (%%NNNN) resolution via data/lookups/windows_msg_codes.csv.
          // C.Lookup is a factory (no `new`); two-arg .match() returns the column value.
          var _winCodeLookup = null;
          if (CFG.resolveWinCodes) {
            try { _winCodeLookup = C.Lookup('windows_msg_codes.csv', 'code', ['value']); }
            catch (lookupErr) { _winCodeLookup = null; }
          }

          function resolveWinCodes(node) {
            if (node == null || _winCodeLookup == null) return node;
            var t = typeof node;
            if (t === 'string') {
              if (node.length >= 3 && node.charCodeAt(0) === 37 && node.charCodeAt(1) === 37 && /^%%\d+$/.test(node)) {
                try {
                  var resolved = _winCodeLookup.match(node, 'value');
                  if (typeof resolved === 'string' && resolved !== '') return resolved;
                } catch (_matchErr) { /* leave the code unresolved */ }
              }
              return node;
            }
            if (t !== 'object') return node;
            if (Array.isArray(node)) {
              var arr = new Array(node.length);
              for (var i = 0; i < node.length; i++) arr[i] = resolveWinCodes(node[i]);
              return arr;
            }
            var result = {};
            var keys = Object.keys(node);
            for (var ki = 0; ki < keys.length; ki++) result[keys[ki]] = resolveWinCodes(node[keys[ki]]);
            return result;
          }

          // Sanitize key names — replace spaces with underscores
          function sKey(name) {
            return typeof name === 'string' ? name.replace(/ /g, '_') : name;
          }

          // Recursively clean parseWinEvent output (unwrap _value/#text, flatten
          // named Data arrays/objects, strip xmlns, normalize key names).
          function clean(node) {
            if (node == null) return undefined;
            if (typeof node !== 'object') return node;
            if (Array.isArray(node)) {
              return node.map(clean).filter(function (x) { return x != null; });
            }
            var textKey = '_value' in node ? '_value' : ('#text' in node ? '#text' : null);
            if (textKey) {
              var keys = Object.keys(node);
              var attrs = keys.filter(function (k) {
                return k !== textKey && k !== 'xmlns' && node[k] != null && node[k] !== '';
              });
              if (attrs.length === 0) return node[textKey];
              var out = {};
              for (var ai = 0; ai < attrs.length; ai++) out[sKey(attrs[ai])] = clean(node[attrs[ai]]);
              out.value = node[textKey];
              return out;
            }
            var result = {};
            var objKeys = Object.keys(node);
            for (var i = 0; i < objKeys.length; i++) {
              var k = objKeys[i];
              var v = node[k];
              if (k === 'xmlns') continue;
              // Named Data array → { Name1: val, Name2: val }
              if (k === 'Data' && Array.isArray(v) && v.length > 0 && v[0] && v[0].Name) {
                for (var di = 0; di < v.length; di++) {
                  var d = v[di];
                  if (d && d.Name) {
                    result[sKey(d.Name)] = d._value != null ? d._value : (d['#text'] != null ? d['#text'] : '');
                  }
                }
                continue;
              }
              // Single named Data element
              if (k === 'Data' && v && !Array.isArray(v) && typeof v === 'object' && v.Name) {
                result[sKey(v.Name)] = v._value != null ? v._value : '';
                continue;
              }
              // Data already flattened to a keyed object → merge into parent
              if (k === 'Data' && v && !Array.isArray(v) && typeof v === 'object' &&
                  !v.Name && !('_value' in v) && !('#text' in v)) {
                var dataKeys = Object.keys(v);
                for (var mi = 0; mi < dataKeys.length; mi++) {
                  var mk = dataKeys[mi];
                  if (mk === 'xmlns') continue;
                  var mv = clean(v[mk]);
                  if (mv != null) result[sKey(mk)] = mv;
                }
                continue;
              }
              // Unnamed Data array — keep as array of values
              if (k === 'Data' && Array.isArray(v) && v.length > 0 && v[0] && !v[0].Name) {
                result.Data = v.map(function (d) {
                  return d && d._value != null ? d._value : (d && d['#text'] != null ? d['#text'] : clean(d));
                }).filter(function (x) { return x != null; });
                continue;
              }
              var c = clean(v);
              if (c != null) result[sKey(k)] = c;
            }
            return result;
          }

          // Parse Classic rendered text: Key=Value headers + tokenized Message body.
          function parseClassic(text) {
            function messageBodyLine(msgRoot, line, st) {
              var trimmed = (line || '').trim();
              if (!trimmed) { st.sectionKey = null; return; }
              var colonIdx = trimmed.indexOf(':');
              if (colonIdx > 0) {
                var keyPart = trimmed.substring(0, colonIdx).trim();
                var valPart = trimmed.substring(colonIdx + 1).trim();
                if (valPart) {
                  var fk = sKey(keyPart);
                  if (st.sectionKey && msgRoot[st.sectionKey]) msgRoot[st.sectionKey][fk] = valPart;
                  else msgRoot[fk] = valPart;
                  return;
                }
                st.sectionKey = sKey(keyPart);
                if (!msgRoot[st.sectionKey]) msgRoot[st.sectionKey] = {};
                return;
              }
              if (st.sectionKey && msgRoot[st.sectionKey]) {
                var existing = msgRoot[st.sectionKey]._description || '';
                msgRoot[st.sectionKey]._description = existing ? existing + ' ' + trimmed : trimmed;
              }
            }

            var result = {};
            var lines = text.split(/\r?\n/);
            var inMessage = false;
            var msgState = { sectionKey: null };
            var msgTokens = null;
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (!inMessage) {
                if (i === 0 && line.indexOf('=') === -1 && line.trim()) {
                  result._eventTime = line.trim();
                  continue;
                }
                var eq = line.indexOf('=');
                if (eq > 0) {
                  var hk = sKey(line.substring(0, eq).trim());
                  var hv = line.substring(eq + 1).trim();
                  if (hk === 'Message') {
                    var msgLines = hv.split(/\r?\n/);
                    msgTokens = { _summary: (msgLines[0] || '').trim() };
                    msgState.sectionKey = null;
                    for (var j = 1; j < msgLines.length; j++) messageBodyLine(msgTokens, msgLines[j], msgState);
                    inMessage = msgLines.length <= 1;
                  } else {
                    result[hk] = hv;
                  }
                }
              } else {
                messageBodyLine(msgTokens, line, msgState);
              }
            }
            if (msgTokens) result.Message = msgTokens;
            return result;
          }

          // Detect format and parse (anchored XML detection, as in the nested-JSON pipeline).
          // __time_utc marks _time as authoritatively UTC so the host_timezone shift is skipped.
          var parsed;
          var isXml = /^<(\?xml|Event\b)/.test(raw);
          __e.__time_utc = false;

          if (isXml) {
            var xmlParsed = C.Text.parseWinEvent(raw, []);
            if (!xmlParsed) throw new Error('parseWinEvent returned null');
            parsed = clean(xmlParsed.Event || xmlParsed);
            if (parsed.System) {
              var tc = parsed.System.TimeCreated;
              if (tc) {
                var ts = typeof tc === 'object' ? (tc.SystemTime || tc.value) : tc;
                if (ts) {
                  var xms = Date.parse(ts);
                  if (!isNaN(xms)) { __e._time = xms / 1000; __e.__time_utc = true; }
                }
              }
            }
          } else {
            parsed = parseClassic(raw);
            var tf2 = parsed._eventTime || parsed.TimeGenerated;
            if (tf2) {
              var pts = Date.parse(tf2);
              if (!isNaN(pts)) {
                __e._time = pts / 1000;
                __e.__time_utc = /(?:Z|[+\-]\d{2}:?\d{2})\s*$/.test(String(tf2));
              }
            }
          }

          if (CFG.resolveWinCodes && _winCodeLookup != null) parsed = resolveWinCodes(parsed);

          // ===============================================================
          // STAGE 2 — NORMALIZE (one System header + one EventData shape)
          // ===============================================================

          // Value helpers. Windows uses '-' / '' / NULL SID for "not applicable".
          function nv(x) {
            if (x == null) return null;
            if (typeof x === 'object') { if (Array.isArray(x)) return null; x = x.value; if (x == null) return null; }
            var s = String(x).trim();
            return (s === '' || s === '-' || s === 'N/A' || s === '(null)' || s === 'S-1-0-0' || s === 'NULL SID') ? null : s;
          }
          function num(x) {
            var s = nv(x);
            if (s == null) return null;
            var n = /^0x[0-9a-f]+$/i.test(s) ? parseInt(s, 16) : (/^-?\d+$/.test(s) ? parseInt(s, 10) : NaN);
            return isNaN(n) ? null : n;
          }
          function first() {
            for (var i = 0; i < arguments.length; i++) { var v = nv(arguments[i]); if (v != null) return v; }
            return null;
          }
          function msTime(x) {
            var s = nv(x);
            if (s == null) return null;
            // Sysmon UtcTime is "YYYY-MM-DD HH:MM:SS.mmm" in UTC with no zone marker
            if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(\.\d+)?$/.test(s)) s = s.replace(' ', 'T') + 'Z';
            var t = Date.parse(s);
            return isNaN(t) ? null : t;
          }

          var S = {};     // normalized System header
          var ED = {};    // normalized EventData (XML names)
          var SYS_REST = {};

          // Classic → XML EventData name translation.
          // Section roles: identity fields inside these sections belong to a principal.
          var CLASSIC_ROLE = {
            Subject: 'S', Creator_Subject: 'S',
            New_Logon: 'T', Account_For_Which_Logon_Failed: 'T', Target_Subject: 'T',
            Account_Whose_Credentials_Were_Used: 'T', Target_Account: 'T', New_Account: 'T',
            Account_That_Was_Locked_Out: 'T', Account_Information: 'T', Logon_Account: 'T',
            Member: 'M',
            Group: 'G', New_Group: 'G', Changed_Group: 'G', Deleted_Group: 'G'
          };
          var ROLE_KEYS = {
            S: { Security_ID: 'SubjectUserSid', Account_Name: 'SubjectUserName', Account_Domain: 'SubjectDomainName', Logon_ID: 'SubjectLogonId' },
            T: { Security_ID: 'TargetUserSid', User_ID: 'TargetUserSid', Account_Name: 'TargetUserName', Account_Domain: 'TargetDomainName',
                 Supplied_Realm_Name: 'TargetDomainName', Logon_ID: 'TargetLogonId', Logon_GUID: 'TargetLogonGuid',
                 Linked_Logon_ID: 'TargetLinkedLogonId', Network_Account_Name: 'TargetOutboundUserName',
                 Network_Account_Domain: 'TargetOutboundDomainName', Old_Account_Name: 'OldTargetUserName', New_Account_Name: 'NewTargetUserName' },
            M: { Security_ID: 'MemberSid', Account_Name: 'MemberName' },
            G: { Security_ID: 'TargetSid', Group_Name: 'TargetUserName', Group_Domain: 'TargetDomainName',
                 Account_Name: 'TargetUserName', Account_Domain: 'TargetDomainName' }
          };
          var CLASSIC_KEYS = {
            Logon_Type: 'LogonType', Restricted_Admin_Mode: 'RestrictedAdminMode', Virtual_Account: 'VirtualAccount',
            Elevated_Token: 'ElevatedToken', Impersonation_Level: 'ImpersonationLevel',
            Workstation_Name: 'WorkstationName', Source_Network_Address: 'IpAddress', Network_Address: 'IpAddress',
            Client_Address: 'IpAddress', Source_Port: 'IpPort', Port: 'IpPort', Client_Port: 'IpPort',
            Process_ID: 'ProcessId', Process_Name: 'ProcessName', Caller_Process_ID: 'ProcessId', Caller_Process_Name: 'ProcessName', New_Process_ID: 'NewProcessId', New_Process_Name: 'NewProcessName',
            Creator_Process_ID: 'ProcessId', Creator_Process_Name: 'ParentProcessName', Process_Command_Line: 'CommandLine',
            Token_Elevation_Type: 'TokenElevationType', Mandatory_Label: 'MandatoryLabel', Exit_Status: 'Status',
            Logon_Process: 'LogonProcessName', Authentication_Package: 'AuthenticationPackageName',
            Transited_Services: 'TransmittedServices', 'Package_Name_(NTLM_only)': 'LmPackageName', Key_Length: 'KeyLength',
            Failure_Reason: 'FailureReason', Status: 'Status', Sub_Status: 'SubStatus', Failure_Code: 'Status', Result_Code: 'Status',
            Error_Code: 'Status', Source_Workstation: 'Workstation', Logon_Account: 'TargetUserName',
            Service_Name: 'ServiceName', Service_ID: 'ServiceSid', Service_File_Name: 'ServiceFileName', Service_Type: 'ServiceType',
            Service_Start_Type: 'ServiceStartType', Service_Account: 'ServiceAccount',
            Ticket_Options: 'TicketOptions', Ticket_Encryption_Type: 'TicketEncryptionType', 'Pre-Authentication_Type': 'PreAuthType',
            Task_Name: 'TaskName', Task_Content: 'TaskContent', Task_New_Content: 'TaskContentNew',
            Object_Server: 'ObjectServer', Object_Type: 'ObjectType', Object_Name: 'ObjectName', Handle_ID: 'HandleId',
            Accesses: 'AccessList', Access_Mask: 'AccessMask', Object_Value_Name: 'ObjectValueName', Operation_Type: 'OperationType',
            Old_Value_Type: 'OldValueType', Old_Value: 'OldValue', New_Value_Type: 'NewValueType', New_Value: 'NewValue',
            Privileges: 'PrivilegeList', Session_Name: 'SessionName', Client_Name: 'ClientName',
            Target_Server_Name: 'TargetServerName', Additional_Information: 'TargetInfo', Caller_Computer_Name: 'CallerComputerName',
            Application_Name: 'Application', Direction: 'Direction', Source_Address: 'SourceAddress',
            Destination_Address: 'DestAddress', Destination_Port: 'DestPort', Protocol: 'Protocol',
            'Filter_Run-Time_ID': 'FilterRTID', Layer_Name: 'LayerName', 'Layer_Run-Time_ID': 'LayerRTID'
          };
          // WFP (515x) uses "Source Port" for the local port, not the logon client port
          var WFP_KEYS = { Source_Port: 'SourcePort', Process_ID: 'ProcessID' };

          function classicToEventData(msg, eventId) {
            var ed = {};
            if (!msg || typeof msg !== 'object') return ed;
            var wfp = eventId >= 5150 && eventId <= 5159;
            function put(k, v) { if (ed[k] === undefined) ed[k] = v; }
            function mapKey(k) { return (wfp && WFP_KEYS[k]) || CLASSIC_KEYS[k] || k; }
            var mk = Object.keys(msg);
            for (var i = 0; i < mk.length; i++) {
              var k = mk[i];
              if (k === '_summary') continue;
              var v = msg[k];
              if (v && typeof v === 'object') {
                var role = CLASSIC_ROLE[k];
                var sk = Object.keys(v);
                for (var j = 0; j < sk.length; j++) {
                  if (sk[j] === '_description') continue;
                  var tgt = (role && ROLE_KEYS[role][sk[j]]) || mapKey(sk[j]);
                  put(tgt, v[sk[j]]);
                  if (role === 'T' && sk[j] === 'Security_ID') put('TargetSid', v[sk[j]]);
                }
              } else {
                put(mapKey(k), v);
              }
            }
            return ed;
          }

          var CLASSIC_LEVEL = { critical: 1, error: 2, warning: 3, information: 4, verbose: 5, 'audit success': 0, 'audit failure': 0 };

          if (isXml) {
            var sys = parsed.System || {};
            var prov = sys.Provider;
            S.provider = nv(prov && typeof prov === 'object' ? (prov.Name || prov.EventSourceName) : prov);
            S.eventId = num(sys.EventID);
            S.level = num(sys.Level);
            S.keywords = nv(sys.Keywords);
            var tcx = sys.TimeCreated;
            S.timeCreated = nv(tcx && typeof tcx === 'object' ? (tcx.SystemTime || tcx.value) : tcx);
            S.recordId = nv(sys.EventRecordID);
            S.channel = nv(sys.Channel);
            S.computer = nv(sys.Computer);
            S.correlation = sys.Correlation && typeof sys.Correlation === 'object' ? nv(sys.Correlation.ActivityID) : null;
            S.pid = sys.Execution && typeof sys.Execution === 'object' ? num(sys.Execution.ProcessID) : null;
            S.tid = sys.Execution && typeof sys.Execution === 'object' ? num(sys.Execution.ThreadID) : null;
            S.userSid = sys.Security && typeof sys.Security === 'object' ? nv(sys.Security.UserID) : null;
            var ri = parsed.RenderingInfo && typeof parsed.RenderingInfo === 'object' ? parsed.RenderingInfo : {};
            S.message = nv(ri.Message);
            S.levelName = nv(ri.Level);
            SYS_REST = { Version: sys.Version, Task: nv(ri.Task) || sys.Task, Opcode: nv(ri.Opcode) || sys.Opcode, Keywords: sys.Keywords,
                         ProcessID: S.pid, ThreadID: S.tid, UserID: S.userSid, ActivityID: S.correlation };
            // EventData, or the single child of UserData (e.g. UserData.LogFileCleared for 1102/104)
            var edSrc = parsed.EventData;
            if (edSrc == null && parsed.UserData && typeof parsed.UserData === 'object') {
              var uk = Object.keys(parsed.UserData);
              if (uk.length) edSrc = parsed.UserData[uk[0]];
            }
            ED = edSrc && typeof edSrc === 'object' && !Array.isArray(edSrc) ? edSrc : (edSrc != null ? { Data: edSrc } : {});
          } else {
            // Classic SourceName is the legacy display name; use the ETW provider name so metadata matches XML
            var CLASSIC_PROVIDERS = { 'microsoft windows security auditing.': 'Microsoft-Windows-Security-Auditing',
                                      'microsoft-windows-security-auditing': 'Microsoft-Windows-Security-Auditing',
                                      'microsoft-windows-eventlog': 'Microsoft-Windows-Eventlog' };
            S.provider = CLASSIC_PROVIDERS[String(parsed.SourceName || '').toLowerCase()] || nv(parsed.SourceName);
            S.eventId = num(parsed.EventCode || parsed.EventID);
            var ctype = String(parsed.Type || '').toLowerCase();
            S.level = CLASSIC_LEVEL[ctype] !== undefined ? CLASSIC_LEVEL[ctype] : null;
            S.levelName = nv(parsed.Type);
            S.keywords = nv(parsed.Keywords) || (ctype.indexOf('audit') === 0 ? parsed.Type : null);
            S.timeCreated = nv(parsed._eventTime || parsed.TimeGenerated);
            S.recordId = nv(parsed.RecordNumber);
            S.channel = nv(parsed.LogName);
            S.computer = nv(parsed.ComputerName);
            S.userSid = nv(parsed.Sid);
            S.message = parsed.Message && typeof parsed.Message === 'object' ? nv(parsed.Message._summary) : nv(parsed.Message);
            SYS_REST = { Task: parsed.TaskCategory, Opcode: parsed.OpCode, Keywords: parsed.Keywords, EventType: parsed.EventType,
                         User: parsed.User, SidType: parsed.SidType };
            ED = classicToEventData(parsed.Message, S.eventId);
          }

          // Align host with the Windows computer name (same as the nested-JSON pipeline)
          if (S.computer) __e.host = S.computer;

          var chan = String(S.channel || '').toLowerCase();
          var provLc = String(S.provider || '').toLowerCase();
          var isSysmon = provLc === 'microsoft-windows-sysmon' || chan === 'microsoft-windows-sysmon/operational';
          var isSecurity = chan === 'security';
          var id = S.eventId;
          if (id == null) throw new Error('No EventID / EventCode found - not a Windows event');

          // ===============================================================
          // STAGE 3 — MAP TO OCSF 1.4.0
          // ===============================================================

          var OCSF_VERSION = '1.4.0';
          var CLASSES = {
            0: ['Base Event', 0, 'Uncategorized'],
            1001: ['File System Activity', 1, 'System Activity'],
            1002: ['Kernel Extension Activity', 1, 'System Activity'],
            1005: ['Module Activity', 1, 'System Activity'],
            1006: ['Scheduled Job Activity', 1, 'System Activity'],
            1007: ['Process Activity', 1, 'System Activity'],
            1008: ['Event Log Activity', 1, 'System Activity'],
            1009: ['Script Activity', 1, 'System Activity'],
            3001: ['Account Change', 3, 'Identity & Access Management'],
            3002: ['Authentication', 3, 'Identity & Access Management'],
            3003: ['Authorize Session', 3, 'Identity & Access Management'],
            3005: ['User Access Management', 3, 'Identity & Access Management'],
            3006: ['Group Management', 3, 'Identity & Access Management'],
            4001: ['Network Activity', 4, 'Network Activity'],
            4003: ['DNS Activity', 4, 'Network Activity'],
            201001: ['Registry Key Activity', 1, 'System Activity'],
            201002: ['Registry Value Activity', 1, 'System Activity'],
            201004: ['Windows Service Activity', 1, 'System Activity']
          };
          var STATUS_NAMES = { 0: 'Unknown', 1: 'Success', 2: 'Failure', 99: 'Other' };
          var SEVERITY_NAMES = { 0: 'Unknown', 1: 'Informational', 2: 'Low', 3: 'Medium', 4: 'High', 5: 'Critical', 6: 'Fatal', 99: 'Other' };
          var WIN_LEVEL_NAMES = { 0: 'LogAlways', 1: 'Critical', 2: 'Error', 3: 'Warning', 4: 'Information', 5: 'Verbose' };

          // ---------- object builders ----------
